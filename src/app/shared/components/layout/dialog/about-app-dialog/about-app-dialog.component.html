<h2 mat-dialog-title>حول النظام</h2>
<mat-dialog-content>
  <div class="text-center py-4">
    <img src="assets/logo.png" alt="Ventas Logo" class="app-logo mb-3">
    <h3 class="fw-bold text-navy mb-1">Ventas POS</h3>
    <p class="text-muted mb-2">نظام إدارة نقاط البيع والمخازن المتكامل</p>
    <span class="badge bg-primary text-white px-3 py-1">الإصدار 2.1</span>
    <div class="mt-4 pt-3 border-top text-muted fs-7">
      تطوير وتشغيل <strong>شركة Omelnour</strong>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">إغلاق</button>
</mat-dialog-actions>
