<mat-card class="mat-elevation-z2">

  <mat-card-header>
    <form class="example-form">
      <mat-form-field class="example-full-width">
        <mat-label>{{arabic.stock.category.util.searchBar}}</mat-label>
        <input type="text" [placeholder]="arabic.stock.category.util.searchBar" matInput [formControl]="myControl"
          [matAutocomplete]="auto" (keyup.enter)="search()">
        <mat-icon color="accent" matSuffix>search</mat-icon>
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
          @for (option of filteredOptions | async; track option) {
            <mat-option [value]="option"
              (click)="OnHumanSelected(option)">
              {{option}}
            </mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </form>

    <button mat-icon-button class="fab-right" color="primary" (click)="refresh()">
      <mat-icon>replay</mat-icon>
    </button>


    <button mat-mini-fab class="fab-right" (click)="addCategoryDialog()">
      <mat-icon>add</mat-icon>
    </button>

  </mat-card-header>
  <mat-card-content>
    @if (isLoading) {
      <mat-progress-bar color="accent" mode="indeterminate" value="20"></mat-progress-bar>
    }
    <table mat-table
      [dataSource]="categoryList | paginate: {itemsPerPage: pageSize, currentPage: page, totalItems:count}">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> م </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="categoryName">
        <th mat-header-cell *matHeaderCellDef> الاسم </th>
        <td mat-cell *matCellDef="let element"> {{element.categoryName}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element" class="action-link">

          <button mat-icon-button class="action-icon action-icon--edit" (click)="editeDialog('Update',element)">
            <mat-icon>create</mat-icon>
          </button>
          |
          <button mat-icon-button class="action-icon action-icon--delete" (click)="deleteDialog('Delete',element)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="text-center mt-3" style="direction: ltr;">
      <pagination-controls (pageChange)="handlePageChange($event)"></pagination-controls>
    </div>

  </mat-card-content>
</mat-card>
