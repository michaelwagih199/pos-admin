<mat-card class="mat-elevation-z2">

    <mat-card-header>
        <div class="row ">
            <div class="col mt-2">
                <div class="row justify-content-center">
                    <p class="mt-2">اسم المورد</p>
                    <p class="text-white bg-blue_primary-dark rounded p-2 mr-4 block">{{supplier.supplierName}}</p>
                </div>
            </div>

            <div class="ml-3 mt-2">
                <button mat-icon-button color="accent" (click)="back()">
                    <mat-icon>arrow_circle_up
                    </mat-icon>
                </button>
            </div>
        </div>
    </mat-card-header>
    <mat-card-content>
        <mat-tab-group class="mt-3">
            <mat-tab label="الدفعات">
                <app-supliers-payment></app-supliers-payment>
            </mat-tab>

            <mat-tab label="الطلبات">
                <app-supplier-orders></app-supplier-orders>
            </mat-tab>

        </mat-tab-group>
    </mat-card-content>
</mat-card>
