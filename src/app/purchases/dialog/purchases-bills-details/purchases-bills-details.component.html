<div class="bg-gray-300 rounded text-center text-white mt-2 mb-2">
  <h1>تفاصيل الفاتورة</h1>
</div>

<mat-dialog-content>
  <table mat-table [dataSource]="listDetails" class="mat-elevation-z2">
    <!-- Product Column -->
    <ng-container matColumnDef="product">
      <th mat-header-cell *matHeaderCellDef> المنتج </th>
      <td mat-cell *matCellDef="let element"> {{ element.product.productName }} </td>
    </ng-container>

    <!-- Quantity (itemQuantity) -->
    <ng-container matColumnDef="itemQuantity">
      <th mat-header-cell *matHeaderCellDef> الكمية (م/كجم) </th>
      <td mat-cell *matCellDef="let element"> {{ element.itemQuantity }} </td>
    </ng-container>

    <!-- Number of Pieces -->
    <ng-container matColumnDef="numberOfPieces">
      <th mat-header-cell *matHeaderCellDef> عدد الاتواب </th>
      <td mat-cell *matCellDef="let element"> {{ element.numberOfPieces }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions align="center">
  <button mat-raised-button color="primary" (click)="close()" tabindex="1">الغاء</button>
</mat-dialog-actions>
